services:
  - type: web
    name: sk-mobiles-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build -w server
    startCommand: npm run start:prod -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://sk-mobiles-client.onrender.com

  - type: web
    name: sk-mobiles-client
    runtime: static
    plan: free
    buildCommand: npm install && npm run build -w client
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        value: https://sk-mobiles-api.onrender.com/api